<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>COPITO TE AMO ❄️❤️</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let particulas = [];
    let elementosFondo = [];

    // --- CONFIGURACIÓN ---
    const texto = "COPITO TE AMO ❄️❤️"; 
    const densidad = 3;          
    const colorTexto = "#ffb7c5"; 
    const velocidadTexto = 0.02;      
    const iconos = ["❄️", "❤️"];   
    // ---------------------

    class ElementoFlotante {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * -canvas.height; 
            this.size = Math.random() * 15 + 12;
            this.char = iconos[Math.floor(Math.random() * iconos.length)];
            this.speed = Math.random() * 0.8 + 0.4; 
            this.wind = Math.random() * 0.6 - 0.3;  
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            this.y += this.speed;
            this.x += this.wind;
            if (this.y > canvas.height) this.reset();
        }
        draw() {
            ctx.globalAlpha = this.opacity;
            ctx.font = `${this.size}px serif`;
            ctx.fillText(this.char, this.x, this.y);
            ctx.globalAlpha = 1.0;
        }
    }

    function inicializar() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particulas = [];
        elementosFondo = [];

        for(let i = 0; i < 40; i++) {
            elementosFondo.push(new ElementoFlotante());
        }

        // Configuración del texto (ajusté el tamaño a 100px para que los emojis del texto se vean bien)
        ctx.fillStyle = "white";
        ctx.font = "bold 100px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(texto, canvas.width / 2, canvas.height / 2);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < canvas.height; y += densidad) {
            for (let x = 0; x < canvas.width; x += densidad) {
                const index = (y * canvas.width + x) * 4;
                if (imgData[index + 3] > 128) { 
                    particulas.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        destX: x,
                        destY: y,
                        size: 1.6
                    });
                }
            }
        }
    }
